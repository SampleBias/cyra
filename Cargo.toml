[workspace]
members = ["crates/cyra-core", "crates/cyra-data", "crates/vmcell", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"
sha2 = { version = "=0.10.9", features = ["force-soft"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rustix = { version = "=1.1.4", features = ["fs"] }
tempfile = "=3.27.0"
parquet = { version = "=60.0.0", default-features = false, features = ["arrow"] }
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
cyra-core = { path = "crates/cyra-core" }
cyra-data = { path = "crates/cyra-data" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
